services:
  a18-realtime:
    build:
      context: .
      dockerfile: Dockerfile
    image: a18-realtime:dev
    ports:
      - "${A18_HTTP_PORT:-5220}:8080"
    environment:
      TZ: Asia/Taipei
      ASPNETCORE_ENVIRONMENT: Production
      A18__Provider: ${A18_PROVIDER:-Stub}
      A18__OperationMode: ${A18_OPERATION_MODE:-Legacy}
      A18__FullMarketPlanPath: /warehouse/market/Taiwan/realtime_subscription_plan.json
      A18__FullMarketYuantaRequiredSymbolsPath: /data/fullmarket-required-symbols.json
      A18__FullMarketShioajiPython: /opt/shioaji/.venv/bin/python
      A18__FullMarketShioajiCollector: /opt/shioaji/fullmarket_stream.py
      A18__FullMarketStartShioajiCollectors: ${A18_FULLMARKET_START_SHIOAJI:-true}
      A18__FullMarketIngestEndpoint: http://127.0.0.1:8080/api/fullmarket/ticks
      History__SecondRoot: /warehouse/market/Taiwan/KLines/Second
      History__Python: /opt/shioaji/.venv/bin/python
      History__Fetcher: /opt/shioaji/history_fetch.py
      SJ_API_KEY: ${SJ_API_KEY:-}
      SJ_SEC_KEY: ${SJ_SEC_KEY:-}
      SJ_PRODUCTION: ${SJ_PRODUCTION:-true}
      Yuanta__Environment: ${YUANTA_ENV:-PROD}
      Yuanta__LoginDelayMilliseconds: ${YUANTA_LOGIN_DELAY_MS:-10000}
      Yuanta__ReadyFreshnessSeconds: ${YUANTA_READY_FRESHNESS_SECONDS:-300}
      Yuanta__SessionRebuildHour: ${YUANTA_SESSION_REBUILD_HOUR:-8}
      Yuanta__SessionRebuildMinute: ${YUANTA_SESSION_REBUILD_MINUTE:-45}
      Yuanta__LogDirectory: /logs/yuanta
      Yuanta__DataDirectory: /data/intraday
      Yuanta__RequiredSymbolsPath: /data/required-symbols.json
      Yuanta__BackfillTimeoutSeconds: ${YUANTA_BACKFILL_TIMEOUT_SECONDS:-30}
      Yuanta__MaxSubscriptions: ${YUANTA_MAX_SUBSCRIPTIONS:-300}
      Yuanta__SubscriptionSubmitDelayMilliseconds: ${YUANTA_SUBMIT_DELAY_MS:-120}
      Yuanta__NoLiveResubmitSeconds: ${YUANTA_NO_LIVE_RESUBMIT_SECONDS:-20}
      Yuanta__AckVerifyDelayMilliseconds: ${YUANTA_ACK_VERIFY_DELAY_MS:-400}
      Yuanta__Account: ${YUANTA_ACCOUNT:-}
      Yuanta__Password: ${YUANTA_PASSWORD:-}
      Yuanta__CertificatePath: ${YUANTA_PFX_PATH:-/run/secrets/yuanta.pfx}
      Yuanta__CertificatePassword: ${YUANTA_PFX_PASSWORD:-}
    volumes:
      - ./data:/data
      - /mnt/d/AIProjects/A18_10_量化交易資料倉庫:/warehouse
      - ../A18_10_量化交易資料倉庫/market/Taiwan/symbols.csv:/data/reference/symbols.csv:ro
      - ./logs:/logs
      - ./secrets/yuanta.pfx:/run/secrets/yuanta.pfx:ro
    restart: unless-stopped
