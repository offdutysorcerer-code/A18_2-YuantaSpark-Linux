# Isolated development environment. Start with: docker compose -f compose.staging.yaml up -d --build
name: a18-2-staging
services:
  staging:
    build:
      context: .
      dockerfile: Dockerfile
    image: a18-realtime:staging
    ports:
      - "127.0.0.1:5221:8080"
    environment:
      TZ: Asia/Taipei
      ASPNETCORE_ENVIRONMENT: Staging
      A18__StagingSafeMode: "true"
      A18__Provider: Stub
      A18__OperationMode: Legacy
      A18__FullMarketStartShioajiCollectors: "false"
      A18__SymbolsPath: /data/reference/symbols.csv
      History__SecondRoot: /warehouse/market/Taiwan/KLines/Second
      History__DisableFetch: "true"
      History__Fetcher: /disabled/history_fetch.py
      History__Python: /usr/bin/false
      Runtime21__BaseUrl: http://127.0.0.1:9/
    volumes:
      - ./staging-data:/data
      - /mnt/d/AIProjects/A18_10_量化交易資料倉庫:/warehouse:ro
      - ../A18_10_量化交易資料倉庫/market/Taiwan/symbols.csv:/data/reference/symbols.csv:ro
      - ./data/reference/non-trading-days.txt:/data/reference/non-trading-days.txt:ro
    restart: unless-stopped
